<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Jawa Banyumasan - Portal Sastra & Budaya Blakasuta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                    },
                    colors: {
                        heritage: { 50: '#fbf8f3', 100: '#f5efe0', 200: '#e9dac1', 300: '#d7bc95', 400: '#c29b6b', 500: '#ad7c48', 600: '#915f33', 700: '#754625', 800: '#5a311b', 900: '#432113', 950: '#271009' },
                        sage: { 50: '#f4f7f5', 100: '#e5ebe6', 200: '#ccd8cf', 300: '#a7bcaa', 400: '#7d9b81', 500: '#5d7e61', 600: '#48644c', 700: '#3c5240', 800: '#324235', 900: '#2b382d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-heritage-50 text-heritage-950 font-sans min-h-screen flex flex-col">

    <header class="bg-heritage-950 text-heritage-100 border-b border-heritage-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center gap-3">
                    <div class="bg-heritage-800 p-2.5 rounded-xl border border-heritage-700 flex items-center justify-center">
                        <svg class="w-8 h-8 text-heritage-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 22h20L12 2z" /><path d="M12 5l-7 14h14l-7-14z" /><path d="M12 2v20M7 16h10M9 12h6M11 8h2" /></svg>
                    </div>
                    <div>
                        <h1 class="font-serif text-lg sm:text-2xl font-bold text-heritage-200">Banyumasan</h1>
                        <p class="text-[10px] sm:text-xs text-heritage-400 tracking-widest uppercase">- Created By Wahyudi</p>
                    </div>
                </div>

                <!-- Desktop Nav -->
                <nav class="hidden lg:flex space-x-1">
                    <button onclick="switchTab('beranda')" id="nav-beranda" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold bg-heritage-900 text-heritage-200 border border-heritage-800">Beranda</button>
                    <button onclick="switchTab('kamus')" id="nav-kamus" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-heritage-400">Kamus Utama</button>
                    <button onclick="handleHeroAiTranslation()" id="nav-penerjemah" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-heritage-400">Penerjemah AI</button>
                    <button onclick="switchTab('sinau')" id="nav-sinau" class="nav-btn px-4 py-2 rounded-lg text-sm font-semibold text-heritage-400">Sinau</button>
                </nav>

                <button onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-lg border border-heritage-800 bg-heritage-900 text-heritage-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div id="mobile-drawer" class="fixed inset-0 z-50 bg-heritage-950/90 backdrop-blur-md hidden">
        <div class="bg-heritage-950 w-72 h-full p-6 shadow-2xl flex flex-col justify-between border-l border-heritage-800">
            <div class="space-y-6">
                <div class="flex items-center justify-between border-b border-heritage-800 pb-4">
                    <span class="font-serif font-bold text-heritage-200">Menu Navigasi</span>
                    <button onclick="toggleMobileMenu()" class="text-heritage-400">Tutup</button>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="switchTab('beranda'); toggleMobileMenu();" id="mob-nav-beranda" class="mob-nav-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold bg-heritage-900 text-heritage-200">Beranda</button>
                    <button onclick="switchTab('kamus'); toggleMobileMenu();" id="mob-nav-kamus" class="mob-nav-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-heritage-400">Kamus Utama</button>
                    <button onclick="handleHeroAiTranslation(); toggleMobileMenu();" id="mob-nav-penerjemah" class="mob-nav-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-heritage-400">Penerjemah AI</button>
                    <button onclick="switchTab('sinau'); toggleMobileMenu();" id="mob-nav-sinau" class="mob-nav-btn text-left px-4 py-2.5 rounded-xl text-sm font-semibold text-heritage-400">Sinau</button>
                </div>
            </div>
            <div class="border-t border-heritage-800 pt-6">
                <div class="flex items-center justify-between bg-heritage-900 px-4 py-3 rounded-xl">
                    <span class="text-xs font-bold text-heritage-400">Mode AI</span>
                    <input type="checkbox" onchange="toggleOnlineMode(this.checked)" class="toggle w-10 h-6 bg-heritage-800 appearance-none rounded-full cursor-pointer relative checked:bg-emerald-600 checked:after:translate-x-4 after:absolute after:top-1 after:left-1 after:w-4 after:h-4 after:bg-white after:rounded-full after:transition-all">
                </div>
            </div>
        </div>
    </div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        <section id="tab-beranda" class="tab-content block animate-fadeIn">
            <div class="bg-heritage-900 rounded-3xl p-10 border border-heritage-800 text-heritage-100 shadow-xl">
                <h2 class="font-serif text-5xl font-bold mb-4">Ora Ngapak, <span class="text-heritage-300 italic">Ora Kepenak!</span></h2>
                <p class="text-heritage-400 max-w-xl">Portal kamus digital untuk melestarikan dialek Banyumasan dengan sentuhan teknologi modern.</p>
                <button onclick="handleHeroAiTranslation()" class="bg-heritage-500 hover:bg-heritage-400 text-heritage-950 px-6 py-3 rounded-xl font-bold text-sm mt-6 transition duration-200">Coba Terjemahkan AI ➔</button>
            </div>
        </section>
        <section id="tab-kamus" class="tab-content hidden animate-fadeIn"><h2 class="text-2xl font-bold p-6">Kamus Utama</h2></section>
        <section id="tab-penerjemah" class="tab-content hidden animate-fadeIn"><h2 class="text-2xl font-bold p-6">Penerjemah AI</h2></section>
        <section id="tab-sinau" class="tab-content hidden animate-fadeIn"><h2 class="text-2xl font-bold p-6">Sinau</h2></section>
    </main>

    <script>
        function toggleMobileMenu() { document.getElementById('mobile-drawer').classList.toggle('hidden'); }
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn, .mob-nav-btn').forEach(btn => {
                btn.classList.remove('bg-heritage-900', 'bg-heritage-800', 'text-heritage-200', 'border');
                btn.classList.add('text-heritage-400');
            });
            const activeBtn = document.getElementById('nav-' + tabId);
            const activeMobBtn = document.getElementById('mob-nav-' + tabId);
            if(activeBtn) { activeBtn.classList.add('bg-heritage-900', 'text-heritage-200', 'border'); activeBtn.classList.remove('text-heritage-400'); }
            if(activeMobBtn) { activeMobBtn.classList.add('bg-heritage-800', 'text-heritage-200'); activeMobBtn.classList.remove('text-heritage-400'); }
        }

        let isOnlineMode = false;
        function toggleOnlineMode(checked) { isOnlineMode = checked; }
        
        function handleHeroAiTranslation() { 
            if(isOnlineMode) {
                switchTab('penerjemah');
            } else {
                alert("Aktifkan Terlebih Dahulu AI Mode!");
            }
        }
    </script>
</body>
</html>
