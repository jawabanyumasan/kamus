<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f4eb; }
        .traditional-font { font-family: 'Cinzel', serif; }
        .card-entry { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border-left: 4px solid transparent; }
        .card-entry:hover { border-left-color: #92400e; background-color: #ffffff; transform: translateY(-2px); }
        .sticky-search { position: sticky; top: 0; z-index: 50; background: rgba(247, 244, 239, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(217, 119, 6, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d97706; border-radius: 9999px; }
    </style>
</head>
<body class="text-slate-800 pb-16">

    <div id="app" class="max-w-3xl mx-auto px-4">
        <!-- Header -->
        <header class="py-8 text-center">
            <div class="inline-block bg-amber-100 text-amber-900 text-xs px-3 py-1 rounded-full font-bold tracking-widest uppercase mb-3">Arsip Leksikon Klasik</div>
            <h1 class="traditional-font text-3xl md:text-5xl font-extrabold text-amber-950 mb-2">Kamus Jawa Kuno</h1>
            <p class="text-amber-800 text-xs md:text-sm font-semibold tracking-widest uppercase">Digitalized By Wahyudi</p>
            <div class="h-0.5 w-24 bg-amber-700 mx-auto mt-5 rounded-full opacity-40"></div>
        </header>

        <!-- Search & Filter Section -->
        <div class="sticky-search py-4 mb-6">
            <div class="bg-white rounded-2xl shadow-xl border border-amber-100 p-2.5">
                <div class="flex flex-col md:flex-row gap-2">
                    <div class="relative flex-grow">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-amber-500"></i>
                        <input type="text" id="searchInput" oninput="debounceSearch()" 
                            placeholder="Cari kata Indonesia atau Kawi..." 
                            class="w-full pl-12 pr-4 py-3.5 rounded-xl border-none focus:ring-2 focus:ring-amber-500 outline-none text-base md:text-lg bg-amber-50/50">
                    </div>
                    <button onclick="toggleMode()" id="modeBtn" class="bg-amber-900 text-white px-6 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-amber-950 transition-all shadow-md">
                        <span id="modeLabel" class="text-sm md:text-base">Indo → Kawi</span>
                        <i class="fas fa-exchange-alt text-xs md:text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Alphabetical Filter Row -->
            <div class="mt-4 flex items-center gap-2">
                <span class="text-xs font-bold text-amber-800 uppercase shrink-0">Indeks:</span>
                <div class="flex gap-1 overflow-x-auto pb-1.5 custom-scrollbar w-full" id="alphabetContainer">
                    <button onclick="filterByLetter('ALL')" id="btn-ALL" class="px-3 py-1 text-xs font-bold rounded-lg bg-amber-900 text-white shadow-sm transition-colors shrink-0">Semua</button>
                    <!-- Generated dynamically in JS -->
                </div>
            </div>

            <!-- Stats Bar -->
            <div id="stats" class="mt-3 px-1 text-xs font-bold text-amber-700 uppercase tracking-wider flex justify-between">
                <span id="countDisplay">Memproses basis data lema kawi...</span>
                <span id="activeFilterDisplay">Seluruh Huruf</span>
            </div>
        </div>

        <!-- Content Area -->
        <div id="results" class="space-y-3">
            <!-- Skeleton Loading Shimmer -->
            <div class="space-y-4 animate-pulse">
                <div class="h-24 bg-white/70 rounded-2xl border border-amber-50"></div>
                <div class="h-24 bg-white/70 rounded-2xl border border-amber-50"></div>
                <div class="h-24 bg-white/70 rounded-2xl border border-amber-50"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-950 text-white px-6 py-3.5 rounded-xl text-xs md:text-sm font-bold shadow-2xl z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none flex items-center gap-2">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span>Berhasil disalin ke papan klip!</span>
    </div>

        let isIndoToKawi = true;
        let searchTimeout;
        let currentLetterFilter = 'ALL';

        // Dynamic creation of Alphabet index bar
        const alphabets = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        const alphabetContainer = document.getElementById("alphabetContainer");
        
        alphabets.forEach(letter => {
            const btn = document.createElement("button");
            btn.id = `btn-${letter}`;
            btn.className = "px-3 py-1 text-xs font-bold rounded-lg bg-white border border-amber-200 text-amber-900 shadow-sm hover:bg-amber-100 transition-colors shrink-0";
            btn.innerText = letter;
            btn.onclick = () => filterByLetter(letter);
            alphabetContainer.appendChild(btn);
        });

        function filterByLetter(letter) {
            // Remove active styles from previous button
            const prevActive = document.getElementById(`btn-${currentLetterFilter}`);
            if (prevActive) {
                prevActive.classList.replace('bg-amber-900', 'bg-white');
                prevActive.classList.replace('text-white', 'text-amber-900');
                prevActive.classList.add('border', 'border-amber-200');
            }

            currentLetterFilter = letter;
            
            // Add active styles to selected button
            const newActive = document.getElementById(`btn-${letter}`);
            if (newActive) {
                newActive.classList.replace('bg-white', 'bg-amber-900');
                newActive.classList.replace('text-amber-900', 'text-white');
                newActive.classList.remove('border', 'border-amber-200');
            }

            document.getElementById('activeFilterDisplay').innerText = letter === 'ALL' ? 'Seluruh Huruf' : `Abjad: ${letter}`;
            performSearch();
        }

        function toggleMode() {
            isIndoToKawi = !isIndoToKawi;
            const btn = document.getElementById('modeBtn');
            const label = document.getElementById('modeLabel');
            const input = document.getElementById('searchInput');
            
            label.innerText = isIndoToKawi ? "Indo → Kawi" : "Kawi → Indo";
            input.placeholder = isIndoToKawi ? "Cari lema Indonesia..." : "Cari lema Jawa Kuno...";
            
            if(isIndoToKawi) {
                btn.classList.replace('bg-amber-100', 'bg-amber-900');
                btn.classList.replace('text-amber-900', 'text-white');
            } else {
                btn.classList.replace('bg-amber-900', 'bg-amber-100');
                btn.classList.replace('text-white', 'text-amber-900');
            }
            performSearch();
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 250);
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const countDisplay = document.getElementById('countDisplay');

            const filtered = dictionaryData.filter(item => {
                // Match search query
                const matchesQuery = isIndoToKawi 
                    ? (item.i.toLowerCase().includes(query) || (item.d && item.d.toLowerCase().includes(query)))
                    : item.k.toLowerCase().includes(query);

                // Match alphabet tab filter
                const matchesLetter = currentLetterFilter === 'ALL' || item.s === currentLetterFilter;

                return matchesQuery && matchesLetter;
            });

            // Sort results
            filtered.sort((a, b) => isIndoToKawi ? a.i.localeCompare(b.i) : a.k.localeCompare(b.k));

            renderResults(filtered, query);
            countDisplay.innerText = `Ditemukan ${filtered.length} lema`;
        }

        function renderResults(data, query) {
            const container = document.getElementById('results');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 opacity-40">
                        <i class="fas fa-scroll text-6xl mb-4 text-amber-800"></i>
                        <p class="text-lg font-bold text-amber-950 traditional-font">Naskah Klasik Kosong</p>
                        <p class="text-xs text-slate-500 mt-1">Lema tidak ditemukan dengan filter saat ini</p>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const headword = isIndoToKawi ? item.i : item.k;
                const definition = isIndoToKawi ? item.k : item.i;
                const extra = item.d ? `<div class="mt-2 text-xs text-amber-850 bg-amber-50/70 p-2.5 rounded-xl italic border border-amber-100/60 flex items-start gap-1.5"><i class="fas fa-info-circle text-amber-600 mt-0.5"></i><div>${item.d}</div></div>` : '';

                return `
                <div class="card-entry bg-white p-5 rounded-2xl shadow-sm border border-amber-100/50 cursor-pointer" onclick="copyText('${headword}: ${definition}')">
                    <div class="flex justify-between items-start gap-3">
                        <div class="flex-grow">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="text-[10px] font-extrabold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-md">${item.s}</span>
                                <h3 class="traditional-font text-xl md:text-2xl font-bold text-amber-950 capitalize leading-none">${headword}</h3>
                            </div>
                            <p class="text-amber-800 font-semibold text-base md:text-lg leading-snug">${definition}</p>
                            ${extra}
                        </div>
                        <button class="text-amber-300 hover:text-amber-700 p-2 transition-all">
                            <i class="far fa-copy text-lg"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            }
            
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2200);
        }

        window.onload = performSearch;
